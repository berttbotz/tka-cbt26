{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><div class="eyebrow">EDITOR</div><h1>{{ 'Edit soal #' ~ q.id if q else 'Tambah soal' }}</h1><p>Kunci jawaban tunggal: A/B/C/D/E. Untuk kompleks, gunakan format A,C.</p></div></div><form method="post" class="panel editform"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Materi<select name="subject">{% for s in subjects %}<option {{ 'selected' if q and q.subject==s else '' }}>{{ s }}</option>{% endfor %}</select></label><label>Kisi-kisi / topik<input name="topic" value="{{ q.topic if q else '' }}" required></label><label>Pertanyaan<textarea name="prompt" rows="4" required>{{ q.prompt if q else '' }}</textarea></label><label>Jenis soal<select name="qtype"><option value="single" {{ 'selected' if q and q.qtype=='single' else '' }}>Pilihan ganda tunggal</option><option value="complex" {{ 'selected' if q and q.qtype=='complex' else '' }}>Pilihan ganda kompleks</option></select></label><div class="optionsedit">{% for i in range(5) %}<label>Opsi {{ 'ABCDE'[i] }}<input name="option" value="{{ options[i] if options|length>i else '' }}" required></label>{% endfor %}</div><label>Kunci jawaban<input name="answer" value="{{ q.answer if q else '' }}" placeholder="misalnya B atau A,C" required></label><label>Pembahasan<textarea name="explanation" rows="3">{{ q.explanation if q else '' }}</textarea></label><label class="check"><input type="checkbox" name="active" value="1" {{ 'checked' if not q or q.active else '' }}> Soal aktif</label><div class="actions"><button class="btn">Simpan soal</button><a class="btn secondary" href="{{ url_for('questions') }}">Batal</a>{% if q %}<button class="btn danger" type="submit" formaction="{{ url_for('delete_question',qid=q.id) }}" formmethod="post" onclick="return confirm('Hapus soal ini?')">Hapus</button>{% endif %}</div></form>{% endblock %}
